nodeLinker: pnp
enableScripts: true

packageExtensions:
  "@testing-library/vue@8.1.0":
    dependencies:
      "@vue/compiler-dom": "3.5.40"
      "@vue/server-renderer": "3.5.40"
  "@vitest/browser@4.1.10":
    dependencies:
      vite: "8.2.0"
  "@vitest/browser-playwright@4.1.10":
    dependencies:
      vite: "8.2.0"
  "vitest@4.1.10":
    dependencies:
      "@opentelemetry/api": "^1.9.0"
  "vitepress@1.6.4":
    dependencies:
      esbuild: "^0.28.1"

# Qwik 1.20 builds successfully with Vite 8 but still declares `vite <8`.
logFilters:
  - code: YN0060
    pattern: "*doesn't satisfy what @builder.io/qwik and other dependencies request*"
    level: discard
